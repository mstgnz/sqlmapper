name: CD

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -v ./...

      # Two things are load-bearing here. The package path: building the module
      # root compiles the library and writes an ar archive, so the release used
      # to ship files that were not executables at all. And the tag stamped into
      # the binary, without which sqlmapper --version reports the pseudo-version
      # the toolchain derives from the checkout rather than the release.
      - name: Build
        run: |
          LDFLAGS="-s -w -X main.version=${{ github.ref_name }}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            out="sqlmapper-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then
              out="${out}.exe"
            fi
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="$LDFLAGS" -o "$out" ./cmd/sqlmapper
          done
          file sqlmapper-linux-amd64
          ./sqlmapper-linux-amd64 --version

      # actions/create-release and actions/upload-release-asset are archived by
      # GitHub and no longer maintained; this action replaces both and uploads
      # every artifact in one step.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            sqlmapper-linux-amd64
            sqlmapper-linux-arm64
            sqlmapper-darwin-amd64
            sqlmapper-darwin-arm64
            sqlmapper-windows-amd64.exe

  docker:
    name: Push Docker image
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            mstgnz/sqlmapper:latest
            mstgnz/sqlmapper:${{ github.ref_name }}
